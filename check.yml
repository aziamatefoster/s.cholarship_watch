name: Scholarship Watch

on:
  schedule:
    - cron: "0 7 * * *"   # every day at 07:00 UTC (07:00 in Ghana)
  workflow_dispatch:        # lets you press "Run workflow" by hand

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Check sources and send email
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python watch.py
      - name: Save what was seen
        run: |
          git config user.name "scholarship-watch"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update seen posts"
          git push
